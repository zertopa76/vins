<style>
:root {
  --paper: #f2f4f3; --panel: #ffffff; --ink: #17212b; --ink-2: #4a5763; --line: #d5dbdf; --line-2: #e6eaec;
  --link: #0b5cad; --primary: #17212b; --on-primary: #ffffff; --focus: #0b5cad;
  --required: #b3261e; --recommended: #8a5a00; --conditional: #1d5a8a; --check: #55616b;
  --hl: #ffd600; --warn-bg: #fff4d6; --warn-line: #e3b341; --err-bg: #fde8e6; --err-line: #e08a84;
  --sans: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --serif: Cambria, "Iowan Old Style", Georgia, "Times New Roman", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #10161c; --panel: #18212a; --ink: #e8edf1; --ink-2: #a3b0bb; --line: #2c3945; --line-2: #222d37;
    --link: #6cb2f2; --primary: #e8edf1; --on-primary: #10161c; --focus: #6cb2f2;
    --required: #ff8a80; --recommended: #f0b44c; --conditional: #7fc0f2; --check: #9fb0bd;
    --warn-bg: #3a2f10; --warn-line: #8a6a1c; --err-bg: #3b1d1b; --err-line: #8a3b36;
  }
}
* { box-sizing: border-box; }
html { color-scheme: light dark; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.5 var(--sans); }
h1, h2, h3 { margin: 0; line-height: 1.25; }
button, input, select { font: inherit; color: inherit; }
a { color: var(--link); text-underline-offset: 2px; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 3px; }
[hidden] { display: none !important; }

/* верхняя панель */
.top { display: flex; align-items: center; gap: 24px; padding: 0 24px; height: 56px; background: var(--panel);
  border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
.brand { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; white-space: nowrap; }
.tabs { display: flex; gap: 4px; height: 100%; }
.tab { background: none; border: 0; border-bottom: 3px solid transparent; padding: 0 14px; cursor: pointer;
  color: var(--ink-2); font-weight: 600; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }
.top .spacer { flex: 1; }
.tool { background: none; border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
.tool:hover { background: var(--line-2); }

/* раскладка */
main { max-width: 1280px; margin: 0 auto; padding: 24px; }
.cols { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 32px; align-items: start; }
.rail { position: sticky; top: 80px; }
@media (max-width: 960px) { .cols { grid-template-columns: 1fr; } .rail { position: static; } }

/* форма */
.rail h2, .block-title { font-size: 15px; font-weight: 700; color: var(--ink-2); margin-bottom: 12px; }
label { display: block; font-weight: 600; font-size: 14px; margin: 14px 0 4px; }
.hint { font-weight: 400; color: var(--ink-2); }
input[type=text], input[type=number], select { width: 100%; padding: 10px 12px; border: 1px solid var(--line);
  border-radius: 6px; background: var(--panel); }
input:hover, select:hover { border-color: var(--ink-2); }
.row2 { display: grid; grid-template-columns: 1fr 110px; gap: 12px; }
.vin-info { min-height: 22px; font-size: 14px; margin-top: 4px; color: var(--ink-2); }
.vin-info.bad { color: var(--required); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 11px 18px;
  border-radius: 6px; border: 1px solid var(--primary); background: var(--primary); color: var(--on-primary);
  font-weight: 700; cursor: pointer; }
.btn:hover { filter: brightness(1.12); }
.btn.secondary { background: transparent; color: var(--ink); border-color: var(--line); font-weight: 600; }
.btn.secondary:hover { background: var(--line-2); filter: none; }
.btn.small { padding: 6px 12px; font-size: 14px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.actions { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
.recent { margin-top: 22px; }
.recent button { display: block; width: 100%; text-align: left; background: none; border: 0;
  border-top: 1px solid var(--line-2); padding: 8px 0; cursor: pointer; color: var(--ink-2); font-size: 14px; }
.recent button:hover { color: var(--ink); }

/* уведомления */
.note { border: 1px solid var(--warn-line); background: var(--warn-bg); border-radius: 6px; padding: 12px 14px;
  margin-bottom: 16px; font-size: 15px; }
.note.err { border-color: var(--err-line); background: var(--err-bg); }
.note .btn { margin-top: 8px; }

/* ход работы */
.progress { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 16px 18px;
  margin-bottom: 20px; }
.progress .head { display: flex; align-items: center; gap: 12px; font-weight: 600; }
.spin { width: 16px; height: 16px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--ink);
  animation: spin .9s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation: none; border-top-color: var(--line); } }
.progress ol { margin: 10px 0 0; padding-left: 20px; color: var(--ink-2); font-size: 14px; max-height: 120px; overflow: auto; }

/* результат */
.result-head { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 8px 16px; }
.result-head .titles { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px; min-width: 0; }
.result-head h1 { font-size: 26px; letter-spacing: -0.01em; }
.result-head .veh { color: var(--ink-2); }
.head-actions { display: flex; gap: 8px; margin-left: auto; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 16px 0 8px; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; flex: 1; }
.chip { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--line); background: var(--panel); font-size: 14px; font-weight: 600; }
.chip .dot { width: 10px; height: 10px; border-radius: 50%; background: currentColor; }
.chip .n { font-variant-numeric: tabular-nums; color: var(--ink-2); font-weight: 600; }
.chip[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.chip.r-required { color: var(--required); } .chip.r-recommended { color: var(--recommended); }
.chip.r-conditional { color: var(--conditional); } .chip.r-check { color: var(--check); }
.chip span:not(.dot):not(.n) { color: var(--ink); }

.items { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.item { display: grid; grid-template-columns: 6px minmax(0, 1fr); border-top: 1px solid var(--line-2); }
.item:first-child { border-top: 0; }
.item .bar { background: var(--role); }
.item .body { padding: 16px 20px 16px 18px; }
.item.r-required { --role: var(--required); } .item.r-recommended { --role: var(--recommended); }
.item.r-conditional { --role: var(--conditional); } .item.r-check { --role: var(--check); }
.item .line1 { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: baseline; }
.badge { font-weight: 700; font-size: 14px; color: var(--role); }
.part { font-size: 20px; font-weight: 650; letter-spacing: -0.005em; overflow-wrap: anywhere; }
.part-ru { font-size: 17px; color: var(--ink-2); }
blockquote { margin: 10px 0 8px; padding: 2px 0 2px 14px; border-left: 2px solid var(--line); font-family: var(--serif);
  font-size: 16.5px; line-height: 1.5; max-width: 74ch; overflow-wrap: anywhere; }
.src { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; font-size: 14px; color: var(--ink-2); }
.src a { font-weight: 600; overflow-wrap: anywhere; }
.src .sp { flex: 1; }
.linkbtn { background: none; border: 0; padding: 4px 0; color: var(--link); cursor: pointer; font-weight: 600;
  font-size: 14px; text-decoration: underline; text-underline-offset: 2px; }
.page-view { margin-top: 12px; }
.page-view img { display: block; max-width: 100%; border: 1px solid var(--line); border-radius: 4px; background: #fff;
  cursor: zoom-in; }
.page-view .msg { color: var(--ink-2); font-size: 14px; }
.empty { padding: 28px 22px; color: var(--ink-2); }
.empty strong { color: var(--ink); }

.side-sections { margin-top: 28px; display: grid; gap: 22px; }
.side-sections ul { margin: 0; padding-left: 20px; }
.side-sections li { margin: 4px 0; overflow-wrap: anywhere; }
.disclaimer { margin-top: 26px; padding-top: 14px; border-top: 1px solid var(--line); color: var(--ink-2); font-size: 14px;
  max-width: 80ch; }

/* свой файл */
.drop { border: 2px dashed var(--line); border-radius: 8px; padding: 26px 18px; text-align: center; background: var(--panel);
  color: var(--ink-2); cursor: pointer; }
.drop.over, .drop:hover { border-color: var(--ink); color: var(--ink); }
.drop .fname { display: block; margin-top: 6px; font-weight: 700; color: var(--ink); overflow-wrap: anywhere; }

/* источники */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 18px 20px; margin-bottom: 16px; }
.card h3 { font-size: 17px; margin-bottom: 8px; }
.kv { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 6px 16px; font-size: 15px; }
.kv dt { color: var(--ink-2); } .kv dd { margin: 0; overflow-wrap: anywhere; }
@media (max-width: 640px) { .kv { grid-template-columns: 1fr; } .kv dt { margin-top: 8px; } }

/* библиотека руководств */
.manual { background: var(--panel); border-color: var(--warn-line); }
.manual h2 { font-size: 18px; margin-bottom: 4px; }
.manual p { margin: 6px 0 10px; }
.miss { list-style: none; padding: 0; margin: 0 0 12px; display: grid; gap: 8px; }
.miss li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; align-items: center;
  border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px; background: var(--paper); }
.miss .mt { font-weight: 600; overflow-wrap: anywhere; }
.miss .mf { grid-column: 1; color: var(--ink-2); font-size: 13px; overflow-wrap: anywhere; }
.miss a.btn { grid-column: 2; grid-row: 1 / span 2; text-decoration: none; white-space: nowrap; }
.say { margin: 4px 0 6px; font-size: 15px; color: var(--ink); }
blockquote .orig { font: 600 12px var(--sans); color: var(--ink-2); text-transform: uppercase; letter-spacing: .04em; }
.drop.small { padding: 14px 16px; }
.drop-status { margin-top: 8px; font-size: 14px; min-height: 1.4em; }
.drop-status .bad { color: var(--required); font-weight: 600; display: block; }
.lib { list-style: none; padding: 0; margin: 10px 0 0; display: grid; gap: 6px; font-size: 15px; }
.lib li { display: flex; gap: 12px; align-items: center; border-bottom: 1px solid var(--line-2); padding: 4px 0; }
.lib .n { flex: 1; overflow-wrap: anywhere; } .lib .s { color: var(--ink-2); font-size: 13px; white-space: nowrap; }

/* окна */
dialog { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--ink); max-width: 640px;
  width: calc(100% - 32px); padding: 22px 24px; }
dialog::backdrop { background: rgba(10, 16, 22, .55); }
dialog h3 { font-size: 19px; margin-bottom: 6px; }
dialog ul { padding-left: 20px; margin: 10px 0 14px; font-size: 14px; overflow-wrap: anywhere; color: var(--ink-2); }
dialog .actions { margin-top: 8px; }
#lightbox { max-width: 96vw; width: auto; padding: 8px; background: #fff; }
#lightbox img { display: block; max-width: 94vw; max-height: 90vh; }
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--primary);
  color: var(--on-primary); padding: 10px 18px; border-radius: 6px; font-weight: 600; z-index: 20; }
.stopped { position: fixed; inset: 0; background: var(--paper); z-index: 30; display: grid; place-items: center;
  text-align: center; padding: 24px; }
.stopped h2 { font-size: 24px; margin-bottom: 8px; }

@media print {
  .top, .rail, .toolbar .btn, .linkbtn, .progress, .actions, .toast, #tab-files .drop, .drop, .manual .btn { display: none !important; }
  body { background: #fff; color: #000; } main { padding: 0; } .cols { display: block; }
  .items, .card { border-color: #999; } .page-view img { max-height: 520px; width: auto; }
}
</style>
</head>
<body>
<header class="top">
  <div class="brand">VinPartsHelper</div>
  <nav class="tabs" role="tablist" aria-label="Разделы">
    <button class="tab" role="tab" id="t-search" aria-selected="true" data-tab="search" data-i18n="tabSearch"></button>
    <button class="tab" role="tab" id="t-files" aria-selected="false" data-tab="files" data-i18n="tabFiles"></button>
    <button class="tab" role="tab" id="t-about" aria-selected="false" data-tab="about" data-i18n="tabAbout"></button>
  </nav>
  <div class="spacer"></div>
  <button class="tool" id="lang" title="Language / Язык">RU / EN</button>
  <button class="tool" id="quit" data-i18n="quit"></button>
</header>

<main>
  <!-- ПОИСК -->
  <section id="tab-search" class="cols" role="tabpanel" aria-labelledby="t-search">
    <form class="rail" id="search-form" autocomplete="off">
      <h2 data-i18n="formTitle"></h2>
      <label for="op"><span data-i18n="fOp"></span></label>
      <input type="text" id="op" list="ops-list" required>
      <datalist id="ops-list"></datalist>

      <label for="model"><span data-i18n="fModel"></span> <span class="hint" data-i18n="fModelHint"></span></label>
      <input type="text" id="model" list="models-list" placeholder="Golf 7">
      <datalist id="models-list"></datalist>

      <div class="row2">
        <div>
          <label for="engine"><span data-i18n="fEngine"></span></label>

let lang = "ru";
try { lang = localStorage.getItem("lang") || "ru"; } catch (e) {}
const t = k => (TX[lang][k] ?? TX.ru[k] ?? k);

/* ---------- мелкие помощники ---------- */
function h(tag, attrs = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === false || v == null) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : document.createTextNode(kid));
  return el;
}
function vehicleText(v) {
  if (!v) return "";
  const eng = v.engine ? (lang === "ru" ? "двигатель " : "engine ") + v.engine : null;
  return [v.make, v.model, v.year, eng].filter(Boolean).join(", ");
}
const cap = x => (x ? x[0].toUpperCase() + x.slice(1) : x);
const safeHref = u => (/^https?:\/\//i.test(u || "") ? u : null);
function toast(msg) {
  const el = h("div", { class: "toast", role: "status" }, msg);
  document.body.append(el); setTimeout(() => el.remove(), 2600);
}
async function api(path, opts = {}) {
  let res;
  try { res = await fetch(path, { ...opts, headers: { "X-Token": TOKEN, ...(opts.headers || {}) } }); }
  catch (e) { throw new Error(t("lost")); }
  const ct = res.headers.get("Content-Type") || "";
  const data = ct.includes("json") ? await res.json() : await res.blob();
  if (!res.ok) throw new Error((data && data.error) || `Ошибка ${res.status}`);
  return data;
}
const post = (path, body) => api(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) });

/* ---------- язык ---------- */
let INFO = null;
function applyLang() {
  document.documentElement.lang = lang;
  $$("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
  if (INFO) fillLists();
  renderAbout(); renderIndexNote(); renderRecent();
  for (const key of ["search", "file"]) if (LAST[key]) renderResult(key);
}
$("#lang").addEventListener("click", () => {
  lang = lang === "ru" ? "en" : "ru";
  try { localStorage.setItem("lang", lang); } catch (e) {}
  applyLang();
});

/* ---------- вкладки ---------- */
$$(".tab").forEach(tab => tab.addEventListener("click", () => {
  $$(".tab").forEach(x => x.setAttribute("aria-selected", String(x === tab)));
  for (const name of ["search", "files", "about"]) $("#tab-" + name).hidden = tab.dataset.tab !== name;
}));

/* ---------- справочные данные ---------- */
function opTitle(o) { return (TX[lang].ops || {})[o.id] || o.title_ru; }
function fillLists() {
  $("#ops-list").replaceChildren(...INFO.operations.map(o => h("option", { value: opTitle(o) })));
  $("#models-list").replaceChildren(...INFO.models.map(m => h("option", { value: m })));
  $("#engines-list").replaceChildren(...INFO.engines.map(c => h("option", { value: c })));
}
async function loadInfo() {
  INFO = await api("/api/info");
  fillLists(); renderAbout(); renderIndexNote();
}
function indexTotal() { return Object.values(INFO?.index || {}).reduce((s, x) => s + x.docs, 0); }
function renderIndexNote() {
  const box = $("#index-note");
  if (!INFO || indexTotal() > 0) { box.replaceChildren(); return; }
  box.replaceChildren(h("div", { class: "note" }, t("indexEmpty"), h("br"),
    h("button", { class: "btn small", type: "button", onclick: () => startIndex(false) }, t("reindex"))));
}

/* ---------- фоновые задачи ---------- */
const LAST = { search: null, file: null };
let polling = {};
function progressBox(target, title, snap) {
  const box = $("#" + target + "-progress");
  if (!snap) { box.replaceChildren(); return; }
  box.replaceChildren(h("div", { class: "progress", role: "status" },
    h("div", { class: "head" }, h("div", { class: "spin" }), h("span", {}, title),
      h("span", { style: "flex:1" }), h("button", { class: "btn secondary small", type: "button",
        onclick: () => post(`/api/job/${snap.id}/cancel`).catch(() => {}) }, t("cancel"))),
    snap.log.length ? h("ol", {}, snap.log.slice(-6).map(l => h("li", {}, l))) : null));
}
async function follow(jobId, target, title) {
  const key = target;
  polling[key] = jobId;
  let since = 0, logAll = [], shownConfirm = null;
  for (;;) {
    let snap;
    try { snap = await api(`/api/job/${jobId}?since=${since}`); }
    catch (e) { progressBox(target, "", null); throw e; }
    if (polling[key] !== jobId) return null;
    since = snap.next; logAll = logAll.concat(snap.log);
    progressBox(target, title, { ...snap, log: logAll });
    if (snap.state === "waiting_confirm" && snap.confirm && shownConfirm !== JSON.stringify(snap.confirm)) {
      shownConfirm = JSON.stringify(snap.confirm);
      askConfirm(jobId, snap.confirm);
    }
    if (["done", "error", "cancelled"].includes(snap.state)) {
      progressBox(target, "", null);
      $("#confirm").open && $("#confirm").close();
      return snap;
    }
    await new Promise(r => setTimeout(r, 600));
  }
}
function askConfirm(jobId, c) {
  $("#confirm-doc").replaceChildren(h("strong", {}, `${t("section")}: `), c.doc.title);
  $("#confirm-list").replaceChildren(...c.resources.map(r => h("li", {}, `${r.title || r.url} (${r.kind})`, h("br"), r.url)));
  $("#confirm-pause").textContent = `${t("pause")}: ${INFO ? INFO.delay : 4} ${t("sec")}.`;
  const d = $("#confirm");
  const answer = choice => { d.close(); post(`/api/job/${jobId}/confirm`, { choice }).catch(() => {}); };
  $("#c-yes").onclick = () => answer("yes");
  $("#c-all").onclick = () => answer("all");
  $("#c-no").onclick = () => answer("no");
  d.oncancel = e => { e.preventDefault(); answer("no"); };
  if (!d.open) d.showModal();
}

function showError(target, message) {
  $("#" + target + "-result").replaceChildren(h("div", { class: "note err", role: "alert" }, message));
}

/* ---------- поиск ---------- */
function opValue(id) { return $(id).value.trim(); }
$("#search-form").addEventListener("submit", async e => {
  e.preventDefault();
  const params = { op: opValue("#op"), model: opValue("#model"), engine: opValue("#engine"),
                   year: opValue("#year"), vin: opValue("#vin"), lang };
  $("#search-result").replaceChildren();
  $("#go").disabled = true;
  try {
    const { job } = await post("/api/search", params);
    saveRecent({ ...params, lang: undefined });
    const snap = await follow(job, "search", t("running"));
    if (!snap) return;
    if (snap.state === "error") showError("search", snap.error);
    else if (snap.state === "done") { LAST.search = { job, result: snap.result, filter: "all" }; renderResult("search"); }
  } catch (err) { showError("search", err.message); }
  finally { $("#go").disabled = false; }
});

async function startIndex(all = false) {
  all = all === true;
  $("#reindex").disabled = $("#allmodels").disabled = true;
  $("#search-result").replaceChildren();
  $("#all-note").replaceChildren();
  try {
    const { job } = await post("/api/index", { models: opValue("#model") ? [opValue("#model")] : [], engines: true,
                                               all_models: all, lang });
    const snap = await follow(job, "search", t("indexing"));
    if (snap && snap.state === "error") showError("search", snap.error);
    else if (snap && snap.state === "done") {
      await loadInfo();
      const total = snap.result.summary.reduce((s, x) => s + x.docs, 0);
      toast(all ? `${t("allDone")}: ${total} ${t("indexFound")}` : `${t("indexDone")}: ${total} ${t("indexFound")}`);
    }
  } catch (err) { showError("search", err.message); }
  finally { $("#reindex").disabled = $("#allmodels").disabled = false; }
}
$("#reindex").addEventListener("click", () => startIndex(false));
$("#allmodels").addEventListener("click", () => {
  const n = Object.values(INFO?.index || {}).reduce((s, x) => s + x.nav, 0) || 150;
  const d = INFO ? INFO.delay : 4, minutes = Math.max(1, Math.round(n * d / 60));
  $("#all-note").replaceChildren(h("div", { class: "note", role: "group" },
    h("strong", {}, t("allTitle")), h("p", {}, t("allText").replace("{n}", n).replace("{d}", d).replace("{m}", minutes)),
    h("button", { class: "btn small", type: "button", onclick: () => startIndex(true) }, t("allStart")), " ",
    h("button", { class: "btn secondary small", type: "button", onclick: () => $("#all-note").replaceChildren() }, t("cancel"))));
});

/* ---------- VIN ---------- */
let vinTimer;
$("#vin").addEventListener("input", () => {
  clearTimeout(vinTimer);
  const box = $("#vin-info"), v = $("#vin").value.replace(/\s+/g, "");
  box.className = "vin-info"; box.textContent = "";
  if (v.length < 17) return;
  vinTimer = setTimeout(async () => {
    try {
      const r = await post("/api/vin", { vin: v });
      if (!r.valid) { box.classList.add("bad"); box.textContent = r.note; return; }
      box.textContent = [r.make || "?", r.year].filter(Boolean).join(", ");
      if (r.year && !$("#year").value) $("#year").value = r.year;
    } catch (e) { /* не критично */ }
  }, 250);
});

/* ---------- недавние ---------- */
function loadRecent() { try { return JSON.parse(localStorage.getItem("recent") || "[]"); } catch (e) { return []; } }
function saveRecent(p) {
  const list = [p, ...loadRecent().filter(x => JSON.stringify(x) !== JSON.stringify(p))].slice(0, 8);
  try { localStorage.setItem("recent", JSON.stringify(list)); } catch (e) {}
  renderRecent();
}
function renderRecent() {
  const box = $("#recent"), list = loadRecent();
  box.hidden = !list.length;
  box.replaceChildren(list.length ? h("div", { class: "block-title" }, t("recent")) : "",
    ...list.map(p => h("button", { type: "button", onclick: () => {
      $("#op").value = p.op; $("#model").value = p.model || ""; $("#engine").value = p.engine || "";
      $("#year").value = p.year || ""; $("#vin").value = p.vin || "";
    } }, [p.op, p.model, p.engine, p.year].filter(Boolean).join(" · "))));
}

/* ---------- результаты ---------- */
const ROLES = ["required", "recommended", "conditional", "check"];
function renderResult(key) {
  const st = LAST[key], r = st.result, box = $("#" + key + "-result");
  const shown = r.findings.filter(f => st.filter === "all" || f.role === st.filter);
  const head = h("div", { class: "result-head" },
    h("div", { class: "titles" }, h("h1", {}, t("resFor") + ": " + (TX[lang].ops[r.operation.id] || r.operation.title_ru)),
      vehicleText(r.vehicle) ? h("span", { class: "veh" }, vehicleText(r.vehicle)) : null),
    r.findings.length ? h("div", { class: "head-actions" },
      h("button", { class: "btn secondary small", type: "button", onclick: () => copyList(r) }, t("copy")),
      h("button", { class: "btn secondary small", type: "button", onclick: () => window.print() }, t("print"))) : null);

  const chips = h("div", { class: "filters", role: "group" },
    h("button", { class: "chip", type: "button", "aria-pressed": String(st.filter === "all"),
      onclick: () => { st.filter = "all"; renderResult(key); } }, h("span", {}, t("all")), h("span", { class: "n" }, String(r.findings.length))),
    ...ROLES.filter(role => r.counts[role]).map(role =>
      h("button", { class: "chip r-" + role, type: "button", title: t("tip_" + role), "aria-pressed": String(st.filter === role),
        onclick: () => { st.filter = st.filter === role ? "all" : role; renderResult(key); } },
        h("span", { class: "dot" }), h("span", {}, t("r_" + role)), h("span", { class: "n" }, String(r.counts[role])))));
  const bar = h("div", { class: "toolbar" }, chips);

  const list = shown.length
    ? h("div", { class: "items" }, shown.map(f => itemEl(st.job, f)))
    : h("div", { class: "items" }, h("div", { class: "empty" }, h("strong", {}, t("noFind")), h("p", {}, t("noFindHelp"))));

  const extra = h("div", { class: "side-sections" },
    r.docs.length ? h("div", {}, h("div", { class: "block-title" }, t("docsUsed")),
      h("ul", {}, r.docs.map(d => h("li", {}, safeHref(d.url) ? h("a", { href: d.url, target: "_blank", rel: "noopener noreferrer" }, d.title) : d.title)))) : null,
    r.notes.length ? h("div", {}, h("div", { class: "block-title" }, t("notes")), h("ul", {}, r.notes.map(n => h("li", {}, linkify(n))))) : null,
    r.requests_made ? h("div", { class: "hint" }, `${t("reqs")}: ${r.requests_made}`) : null);

  const libNote = r.from_library && r.from_library.length
    ? h("div", { class: "hint", style: "margin-bottom:12px" }, `${t("libUsed")}: ${r.from_library.join(", ")}`) : null;
  const blocked = r.missing && r.missing.length && !r.findings.length;   // читать пока нечего: ждём файлы
  box.replaceChildren(...[head, missingEl(key, r), libNote, blocked ? null : bar, blocked ? null : list, extra,
    h("p", { class: "disclaimer" }, t("disclaimer"))].filter(Boolean));
}

/* ---------- библиотека руководств ---------- */
function fmtSize(n) { return n >= 1048576 ? (n / 1048576).toFixed(1) + " " + t("mb") : Math.max(1, Math.round(n / 1024)) + " " + t("kb"); }
/* зона для PDF: можно перетащить несколько файлов или выбрать в окне; onDone вызывается после загрузки */
function dropZone(onDone) {
  const status = h("div", { class: "drop-status", role: "status", "aria-live": "polite" });
  const input = h("input", { type: "file", accept: ".pdf,application/pdf", multiple: true, hidden: true });
  const zone = h("div", { class: "drop small", tabindex: "0", role: "button" }, t("libDrop"));
  async function upload(files) {
    const ok = [], bad = [];
    for (const file of files) {
      status.textContent = `${file.name}…`;
      try {
        const q = new URLSearchParams({ name: file.name });
        await api(`/api/library?${q}`, { method: "POST", body: file });
        ok.push(file.name);
      } catch (err) { bad.push(err.message); }
    }
    status.replaceChildren(
      ok.length ? h("span", {}, `${t("libAdded")}: ${ok.length}`) : null,
      ...bad.map(m => h("span", { class: "bad" }, m)));
    if (ok.length) { try { INFO = await api("/api/info"); } catch (e) {} renderAbout(); }
    if (onDone) onDone(ok, bad);
  }
  zone.addEventListener("click", () => input.click());
  zone.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); input.click(); } });
  input.addEventListener("change", () => { if (input.files.length) upload([...input.files]); input.value = ""; });
  for (const ev of ["dragenter", "dragover"]) zone.addEventListener(ev, e => { e.preventDefault(); zone.classList.add("over"); });
  for (const ev of ["dragleave", "drop"]) zone.addEventListener(ev, e => { e.preventDefault(); zone.classList.remove("over"); });
  zone.addEventListener("drop", e => { if (e.dataTransfer.files.length) upload([...e.dataTransfer.files]); });
  return h("div", {}, zone, input, status);
}
function missingEl(key, r) {
  if (!r.missing || !r.missing.length) return null;
  const retry = h("button", { class: "btn small", type: "button", hidden: true,
    onclick: () => { $$(".tab")[0].click(); $("#search-form").requestSubmit(); } }, t("missRetry"));
  return h("section", { class: "note manual", "aria-labelledby": "miss-title" },
    h("h2", { id: "miss-title" }, t("missTitle")),
    h("p", {}, t("missText")),
    h("ol", { class: "miss" }, r.missing.map(m => h("li", {},
      h("span", { class: "mt" }, m.doc_title ? `${m.doc_title}` : m.title),
      h("span", { class: "mf" }, m.filename),
      safeHref(m.url) ? h("a", { class: "btn secondary small", href: m.url, target: "_blank", rel: "noopener noreferrer" }, t("openBrowser")) : null))),
    dropZone(ok => { retry.hidden = !ok.length; }),
    h("div", { style: "margin-top:10px" }, retry));
}
/* удаление в два нажатия: системные окна подтверждения в окне программы работают не везде */
function delButton(name) {
  const b = h("button", { class: "linkbtn", type: "button" }, t("libDel"));
  let armed = null;
  b.addEventListener("click", async () => {
    if (!armed) {
      b.textContent = t("libDelConfirm"); armed = setTimeout(() => { armed = null; b.textContent = t("libDel"); }, 4000);
      return;
    }
    clearTimeout(armed);
    try { await post("/api/library/delete", { name }); INFO = await api("/api/info"); renderAbout(); }
    catch (err) { toast(err.message); armed = null; b.textContent = t("libDel"); }
  });
  return b;
}
function libraryCard() {
  const lib = INFO.library || { files: [], folder: "" };
  const list = lib.files.length
    ? h("ul", { class: "lib" }, lib.files.map(f => h("li", {},
        h("span", { class: "n" }, f.name), h("span", { class: "s" }, fmtSize(f.size)),
        delButton(f.name))))
    : h("p", { class: "hint" }, t("libEmpty"));
  return h("div", { class: "card" }, h("h3", {}, t("libTitle")),
    h("p", { class: "hint" }, t("libHelp")), dropZone(), list,
    h("p", { class: "hint", style: "margin-top:10px" }, `${t("libFolder")}: ${lib.folder}`));
}

function itemEl(job, f) {
  const view = h("div", { class: "page-view", hidden: true });
  const toggle = h("button", { class: "linkbtn", type: "button" }, t("showPage"));
  let loaded = false;
  toggle.addEventListener("click", async () => {
    if (!view.hidden) { view.hidden = true; toggle.textContent = t("showPage"); return; }
    view.hidden = false; toggle.textContent = t("hidePage");
    if (loaded) return;
    view.replaceChildren(h("span", { class: "msg" }, t("loadingPage")));
    try {
      const blob = await api(`/api/preview/${job}/${f.idx}.png`);
      const img = h("img", { src: URL.createObjectURL(blob), alt: `${f.part}: ${t("page")} ${f.page}`, onclick: () => {
        $("#lightbox img").src = img.src; $("#lightbox").showModal(); } });
      view.replaceChildren(img); loaded = true;
    } catch (err) { view.replaceChildren(h("span", { class: "msg" }, err.message)); }
  });
  const srcLabel = f.local ? `${f.source_title} (${t("localFile")})` : f.source_title;
  const where = f.page ? ` · ${t("page")} ${f.page}` : "";
  return h("article", { class: "item r-" + f.role },
    h("div", { class: "bar" }),
    h("div", { class: "body" },
      h("div", { class: "line1" },
        h("span", { class: "badge", title: t("tip_" + f.role) }, t("r_" + f.role)),
        h("span", { class: "part" }, cap(lang === "ru" && f.part_ru ? f.part_ru : f.part)),
        lang === "ru" && f.part_ru ? h("span", { class: "part-ru" }, cap(f.part)) : null),
      lang === "ru" ? h("p", { class: "say" }, t("say_" + f.role)) : null,
      h("blockquote", {}, h("span", { class: "orig" }, t("orig") + ": "), "«" + f.quote + "»"),
      h("div", { class: "src" },
        safeHref(f.link) ? h("a", { href: f.link, target: "_blank", rel: "noopener noreferrer" }, srcLabel + where) : h("span", {}, srcLabel + where),
        f.mentions > 1 ? h("span", {}, `${f.mentions} ${t("mentions")}`) : null,
        h("span", { class: "sp" }),
        f.previewable ? toggle : null),
      f.previewable ? view : null));
}

/* ссылки внутри текста примечаний делаем кликабельными */
function linkify(text) {
  return String(text).split(/(https?:\/\/[^\s)»]+)/).flatMap(part => {
    if (!/^https?:\/\//i.test(part)) return [part];
    const m = part.match(/^(.*?)([:;,.]*)$/);
    return [h("a", { href: m[1], target: "_blank", rel: "noopener noreferrer" }, m[1]), m[2]];
  });
}
function copyList(r) {
  const lines = [`${TX[lang].ops[r.operation.id] || r.operation.title_ru}${vehicleText(r.vehicle) ? " | " + vehicleText(r.vehicle) : ""}`, ""];
  for (const f of r.findings) {
    const name = lang === "ru" && f.part_ru ? `${cap(f.part_ru)} (${f.part})` : f.part;
    lines.push(`[${t("r_" + f.role)}] ${name}`, lang === "ru" ? `  ${t("say_" + f.role)}` : null, `  ${t("orig")}: «${f.quote}»`,
      `  ${f.source_title}${f.page ? ", " + t("page") + " " + f.page : ""}${f.link ? " " + f.link : ""}`, "");
  }
  lines.push(t("disclaimer"));
  const text = lines.filter(x => x !== null).join("\n");
  const done = () => toast(t("copied"));
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done, () => legacyCopy(text, done));
  else legacyCopy(text, done);
}
function legacyCopy(text, done) {
  const ta = h("textarea", { style: "position:fixed;opacity:0" }); ta.value = text; document.body.append(ta);
  ta.select(); try { document.execCommand("copy"); done(); } catch (e) {} ta.remove();
}
$("#lightbox").addEventListener("click", () => $("#lightbox").close());

/* ---------- свой файл ---------- */
let pickedFile = null;
const drop = $("#drop"), fileInput = $("#file");
function pick(file) { pickedFile = file; $("#fname").textContent = file ? file.name : ""; }
drop.addEventListener("click", () => fileInput.click());
drop.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); fileInput.click(); } });
fileInput.addEventListener("change", () => pick(fileInput.files[0] || null));
for (const ev of ["dragenter", "dragover"]) drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("over"); });
for (const ev of ["dragleave", "drop"]) drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("over"); });
drop.addEventListener("drop", e => { if (e.dataTransfer.files[0]) pick(e.dataTransfer.files[0]); });
$("#file-form").addEventListener("submit", async e => {
  e.preventDefault();
  $("#file-result").replaceChildren();
  if (!pickedFile) return showError("file", t("pickFile"));
  try {
    const q = new URLSearchParams({ name: pickedFile.name, op: opValue("#op2") });
    const { job } = await api(`/api/file?${q}`, { method: "POST", body: pickedFile });
    const snap = await follow(job, "file", t("running"));
    if (!snap) return;
    if (snap.state === "error") showError("file", snap.error);
    else if (snap.state === "done") { LAST.file = { job, result: snap.result, filter: "all" }; renderResult("file"); }
  } catch (err) { showError("file", err.message); }
});

/* ---------- источники ---------- */
function renderAbout() {
  const box = $("#about");
  if (!INFO) return;
  const kv = (...pairs) => h("dl", { class: "kv" }, pairs.flatMap(([k, v]) => [h("dt", {}, k), h("dd", {}, v)]));
  box.replaceChildren(
    ...INFO.sources.map(s => h("div", { class: "card" }, h("h3", {}, `${t("aSources")}: ${s.name}`),
      kv([t("aHosts"), s.hosts.join(", ")],
         [t("aLLM"), s.allows_llm ? "on" : t("aOff")],
         [t("aIndex"), `${INFO.index[s.name].docs} ${t("aDocs")}, ${INFO.index[s.name].nav} ${t("aPages")}`]),
      h("p", { class: "hint" }, s.notes))),
    libraryCard(),
    h("div", { class: "card" }, h("h3", {}, t("aPol")),
      kv([t("aDelay"), `${INFO.delay} ${t("sec")}`],
         [t("aUA"), INFO.user_agent],
         [t("aContact"), INFO.contact_set ? t("aContactYes") : t("aContactNo")],
         [t("aData"), INFO.data_dir],
         [t("aPreview"), INFO.preview ? t("aPrevOn") : t("aPrevOff")],
         [t("aVer"), INFO.version])),
    h("p", { class: "disclaimer" }, t("disclaimer")));
}

/* ---------- выход ---------- */
$("#quit").addEventListener("click", async () => {
  try { await post("/api/shutdown"); } catch (e) {}
  document.body.append(h("div", { class: "stopped" }, h("div", {}, h("h2", {}, t("stoppedT")), h("p", {}, t("stoppedD")))));
  setTimeout(() => window.close(), 400);
});

/* ---------- в окне программы ссылки на источники открываются в обычном браузере ---------- */
document.addEventListener("click", e => {
  const a = e.target.closest && e.target.closest("a[href]");
  const api = window.pywebview && window.pywebview.api;
  if (!a || !api || !api.open_external) return;
  const href = a.getAttribute("href") || "";
  if (/^https?:\/\//i.test(href)) { e.preventDefault(); api.open_external(href); }
});

/* файл, брошенный мимо зоны загрузки, не должен подменять собой страницу программы */
for (const ev of ["dragover", "drop"]) window.addEventListener(ev, e => e.preventDefault());

/* ---------- «окно открыто»: по этому сигналу программа понимает, что её не закрыли ---------- */
setInterval(() => { fetch("/api/ping", { headers: { "X-Token": TOKEN } }).catch(() => {}); }, 5000);

/* ---------- старт ---------- */
applyLang();
loadInfo().catch(err => showError("search", err.message)).then(applyLang);
</script>
